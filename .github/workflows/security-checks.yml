name: Security checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Compile backend and run authentication checks
        run: go test . ./securitychecks
      - name: Vet production and security-check packages
        run: go vet . ./securitychecks

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Validate the locked production dependency tree
        run: npm ls --omit=dev
      - name: Build the production JavaScript bundle
        env:
          EXPO_NO_TELEMETRY: "1"
        run: npx expo export --platform android --output-dir /tmp/comparez-export
